bt_navigator:
  ros__parameters:
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /localization/odometry
    bt_loop_duration: 10
    default_server_timeout: 200
    wait_for_service_timeout: 1000
    action_server_result_timeout: 900.0
    plugin_lib_names:
    - zone_bt_nodes
    navigators:
    - navigate_to_pose
    - navigate_through_poses
    navigate_to_pose:
      plugin: nav2_bt_navigator::NavigateToPoseNavigator
    navigate_through_poses:
      plugin: nav2_bt_navigator::NavigateThroughPosesNavigator
    error_code_names:
    - compute_path_error_code
    - follow_path_error_code
    - smoother_error_code
controller_server:
  ros__parameters:
    controller_frequency: 20.0
    costmap_update_timeout: 0.3
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.5
    odom_topic: /localization/odometry
    progress_checker_plugins:
    - progress_checker
    goal_checker_plugins:
    - goal_checker
    controller_plugins:
    - FollowPath
    progress_checker:
      plugin: nav2_controller::SimpleProgressChecker
      required_movement_radius: 0.3
      movement_time_allowance: 10.0
    goal_checker:
      plugin: nav2_controller::SimpleGoalChecker
      xy_goal_tolerance: 0.15
      yaw_goal_tolerance: 0.3
      stateful: true
    FollowPath:
      plugin: nav_behaviors::ZoneAwareController
      zone:
        zones_file: ''
        min_cells: 50
        slope_min_cells: 50
        types:
        - tunnel
        - slope
        - step_l1
        - step_l2
        - step_high
        - fly_slope
        - undulation
        inner_plugin: nav2_mppi_controller::MPPIController
        speed_limit_reference: 1.5
        window_before: 2.0
        window_after: 0.9
        blend: 0.4
        align_weight: 1.0
        phase_heartbeat: 0.5
        align_before: 0.8
        tunnel_speed: 0.6
        approach_speed: 1.0
        decel: 1.5
        front_extent: 0.39
        rear_extent: 0.31
        check_margin: 0.3
        collision_tolerance: 0.0
        escape_speed: 0.15
        escape_max_distance: 1.5
        block_timeout: 5.0
        trace: true
        gate_dist: 0.3
        gate_stop: 0.03
        lat_tol: 0.03
        yaw_tol_deg: 3.0
        k_lat: 3.0
        max_lat_speed: 0.3
        k_yaw: 3.0
        max_wz: 1.0
        search_dist: 1.0
        ramp_speed: 1.4
        ramp_approach_speed: 1.4
        ramp_decel: 2.0
        ramp_align_before: 1.5
        ramp_lat_tol: 0.12
        ramp_window_before: 6.0
        ramp_window_after: 0.6
        chain_gap: 1.0
        chain_angle_deg: 12.0
        chain_lat: 0.3
      motion_model: Omni
      time_steps: 40
      model_dt: 0.05
      batch_size: 1000
      iteration_count: 1
      retry_attempt_limit: 3
      vx_std: 0.25
      vy_std: 0.25
      wz_std: 0.4
      vx_max: 1.5
      vx_min: -1.5
      vy_max: 1.5
      wz_max: 2.0
      ax_max: 3.0
      ax_min: -3.0
      ay_max: 3.0
      ay_min: -3.0
      az_max: 4.0
      temperature: 0.3
      gamma: 0.015
      transform_tolerance: 0.5
      visualize: false
      regenerate_noises: true
      reset_period: 1.0
      critics:
      - ConstraintCritic
      - CostCritic
      - GoalCritic
      - GoalAngleCritic
      - PathAlignCritic
      - PathFollowCritic
      - PathAngleCritic
      - TwirlingCritic
      ConstraintCritic:
        enabled: true
        cost_power: 1
        cost_weight: 4.0
      GoalCritic:
        enabled: true
        cost_power: 1
        cost_weight: 8.0
        threshold_to_consider: 1.4
      GoalAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 3.0
        threshold_to_consider: 1.5
      CostCritic:
        enabled: true
        cost_power: 1
        cost_weight: 3.81
        near_collision_cost: 253
        critical_cost: 300.0
        consider_footprint: true
        collision_cost: 1000000.0
        near_goal_distance: 1.0
        trajectory_point_step: 2
      PathAlignCritic:
        enabled: true
        cost_power: 1
        cost_weight: 14.0
        max_path_occupancy_ratio: 0.05
        trajectory_point_step: 4
        threshold_to_consider: 0.5
        offset_from_furthest: 20
        use_path_orientations: false
      PathFollowCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        offset_from_furthest: 5
        threshold_to_consider: 1.4
      PathAngleCritic:
        enabled: false
        cost_power: 1
        cost_weight: 2.0
        offset_from_furthest: 4
        threshold_to_consider: 0.5
        max_angle_to_furthest: 0.5
        mode: 2
      TwirlingCritic:
        enabled: true
        twirling_cost_power: 1
        twirling_cost_weight: 6.0
local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 20.0
      publish_frequency: 20.0
      global_frame: map
      robot_base_frame: base_link
      transform_tolerance: 0.5
      rolling_window: true
      width: 8
      height: 8
      resolution: 0.025
      footprint: '[[0.38, 0.30], [0.38, -0.30], [-0.30, -0.30], [-0.30, 0.30]]'
      footprint_padding: 0.01
      plugins:
      - static_layer
      - obstacle_layer
      - inflation_layer
      filters:
      - speed_filter
      speed_filter:
        plugin: nav2_costmap_2d::SpeedFilter
        filter_info_topic: /speed_filter_info
        speed_limit_topic: /speed_limit
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        observation_sources: terrain_hits terrain_rays
        max_obstacle_height: 10.0
        terrain_hits:
          topic: /nav/obstacles
          data_type: PointCloud2
          marking: true
          clearing: false
          min_obstacle_height: -10.0
          max_obstacle_height: 10.0
          obstacle_max_range: 6.0
          obstacle_min_range: 0.0
        terrain_rays:
          topic: /nav/clearing
          data_type: PointCloud2
          marking: false
          clearing: true
          min_obstacle_height: -10.0
          max_obstacle_height: 10.0
          raytrace_max_range: 6.0
          raytrace_min_range: 0.0
      static_layer:
        plugin: nav2_costmap_2d::StaticLayer
        map_topic: /nav_map
        map_subscribe_transient_local: true
        trinary_costmap: false
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        inflation_radius: 0.65
        cost_scaling_factor: 4.0
      always_send_full_costmap: true
global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 2.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_link
      transform_tolerance: 0.5
      resolution: 0.025
      track_unknown_space: false
      footprint: '[[0.38, 0.30], [0.38, -0.30], [-0.30, -0.30], [-0.30, 0.30]]'
      footprint_padding: 0.01
      plugins:
      - static_layer
      - obstacle_layer
      - inflation_layer
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        observation_sources: terrain_hits terrain_rays
        max_obstacle_height: 10.0
        terrain_hits:
          topic: /nav/obstacles
          data_type: PointCloud2
          marking: true
          clearing: false
          min_obstacle_height: -10.0
          max_obstacle_height: 10.0
          obstacle_max_range: 6.0
          obstacle_min_range: 0.0
        terrain_rays:
          topic: /nav/clearing
          data_type: PointCloud2
          marking: false
          clearing: true
          min_obstacle_height: -10.0
          max_obstacle_height: 10.0
          raytrace_max_range: 6.0
          raytrace_min_range: 0.0
      static_layer:
        plugin: nav2_costmap_2d::StaticLayer
        map_topic: /nav_map
        map_subscribe_transient_local: true
        trinary_costmap: false
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        inflation_radius: 0.9
        cost_scaling_factor: 1.5
      always_send_full_costmap: true
speed_mask_server:
  ros__parameters:
    topic_name: /speed_filter_mask
    frame_id: map
    yaml_filename: ''
speed_filter_info_server:
  ros__parameters:
    type: 1
    filter_info_topic: /speed_filter_info
    mask_topic: /speed_filter_mask
    base: 0.0
    multiplier: 1.0
terrain_obstacles:
  ros__parameters:
    terrain_file: ''
    map_frame: map
    base_frame: base_link
    min_height: 0.06
    max_height: 0.24
    ground_tolerance: 0.04
    ceiling_tolerance: 0.01
    max_range: 6.0
    max_age: 0.5
nav_map_server:
  ros__parameters:
    topic_name: /nav_map
    frame_id: map
    yaml_filename: ''
planner_server:
  ros__parameters:
    expected_planner_frequency: 5.0
    planner_plugins:
    - GridBased
    GridBased:
      plugin: nav_behaviors::StartAwarePlanner
      escape_max_distance: 1.5
      tolerance: 0.15
      downsample_costmap: false
      allow_unknown: false
      max_iterations: 1000000
      max_on_approach_iterations: 1000
      max_planning_time: 2.0
      cost_travel_multiplier: 3.0
      use_final_approach_orientation: false
      smoother:
        max_iterations: 1000
        w_smooth: 0.3
        w_data: 0.2
        tolerance: 1.0e-10
smoother_server:
  ros__parameters:
    smoother_plugins:
    - simple_smoother
    - zone_shaper
    simple_smoother:
      plugin: nav2_smoother::SimpleSmoother
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: true
    zone_shaper:
      plugin: nav_behaviors::ZonePathShaper
      zones_file: ''
      min_cells: 50
      slope_min_cells: 50
      types:
      - tunnel
      - slope
      - step_l1
      - step_l2
      - step_high
      - fly_slope
      - undulation
      axis_margin: 0.5
      lead_length: 2.5
      lead_growth: 1.5
      max_retries: 3
      spacing: 0.025
      max_body_offset: 0.03
      max_side_offset: 0.06
      offset_step: 0.01
      tangent_window: 0.25
      slope_lead_length: 2.5
      slope_axis_margin: 0.3
      slope_max_body_offset: 0.06
      chain_gap: 1.0
      chain_angle_deg: 12.0
      chain_lat: 0.3
      footprint: '[[0.38, 0.30], [0.38, -0.30], [-0.30, -0.30], [-0.30, 0.30]]'
      footprint_padding: 0.01
      collision_tolerance: 0.0
behavior_server:
  ros__parameters:
    local_costmap_topic: local_costmap/costmap_raw
    global_costmap_topic: global_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    global_footprint_topic: global_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins:
    - spin
    - backup
    - drive_on_heading
    - wait
    spin:
      plugin: nav2_behaviors::Spin
    backup:
      plugin: nav2_behaviors::BackUp
    drive_on_heading:
      plugin: nav2_behaviors::DriveOnHeading
    wait:
      plugin: nav2_behaviors::Wait
    local_frame: map
    global_frame: map
    robot_base_frame: base_link
    transform_tolerance: 0.5
    simulate_ahead_time: 1.0
    max_rotational_vel: 1.5
    min_rotational_vel: 0.4
    rotational_acc_lim: 3.2
velocity_smoother:
  ros__parameters:
    smoothing_frequency: 30.0
    scale_velocities: false
    feedback: OPEN_LOOP
    max_velocity:
    - 1.6
    - 1.6
    - 2.5
    min_velocity:
    - -1.6
    - -1.6
    - -2.5
    max_accel:
    - 3.0
    - 3.0
    - 4.0
    max_decel:
    - -3.0
    - -3.0
    - -4.0
    odom_topic: /localization/odometry
    odom_duration: 0.1
    deadband_velocity:
    - 0.0
    - 0.0
    - 0.0
    velocity_timeout: 0.5
collision_monitor:
  ros__parameters:
    base_frame_id: base_link
    odom_frame_id: map
    cmd_vel_in_topic: cmd_vel_smoothed
    cmd_vel_out_topic: cmd_vel_collision_checked
    state_topic: /collision_monitor_state
    enable_stamped_cmd_vel: false
    transform_tolerance: 0.5
    source_timeout: 1.0
    base_shift_correction: false
    stop_pub_timeout: 1.0
    polygons:
    - FootprintApproach
    FootprintApproach:
      type: polygon
      action_type: approach
      footprint_topic: /local_costmap/published_footprint
      time_before_collision: 1.0
      simulation_time_step: 0.05
      min_points: 1
      visualize: false
      enabled: true
    observation_sources:
    - terrain
    terrain:
      type: pointcloud
      topic: /nav/obstacles
      min_height: -10.0
      max_height: 10.0
      use_global_height: false
      enabled: true
cmd_gate:
  ros__parameters:
    rate: 30.0
    input_timeout: 0.25
    state_timeout: 2.0
    require_observation: true
    observation_timeout: 0.5
    speed_limit_reference: 1.5
    idle_stop_time: 0.5
    state_topic: /backend_node/localization_state
    mode_topic: /nav_mode
    limits:
      normal:
        max_linear: 1.6
        max_angular: 2.5
      tunnel:
        max_linear: 0.8
        max_angular: 1.0
      ramp:
        max_linear: 1.6
        max_angular: 1.5
      recovery:
        max_linear: 0.6
        max_angular: 1.5
