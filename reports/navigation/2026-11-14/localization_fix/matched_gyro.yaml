zlio:
  ros__parameters:
    frames:
      world: lio_odom
      imu: mid360_link
      lidar: mid360_link
      base: base_link
    input:
      type: pointcloud2
      point_time_field: offset_time
      point_time_scale: 1.0e-09
      point_time_absolute: false
      livox_use_timebase: true
      imu_acceleration_scale: 1.0
      imu_history_seconds: 30.0
      maximum_imu_interval: 0.3
      maximum_imu_samples: 65536
      maximum_buffered_points: 1000000
      maximum_queue_events: 8192
    output:
      resolution: 0.1
      publish_tf: true
      base_extrinsic_tolerance: 0.2
    session:
      wait_for_start: false
      reset_mode: warm
      coordinated_reset: true
    sensor:
      gravity: 9.81
      minimum_range: 0.3
      maximum_range: 40.0
    initialization:
      accel_bias:
      - 0.0
      - 0.0
      - 0.0
      accel_bias_std:
      - 0.3
      - 0.3
      - 0.3
      window_frames: 20
      seed_imu_samples: 31
      maximum_refinements: 15
      sample_size: 0.1
      fallback_sample_size: 0.05
      minimum_sampled_points: 1000
      minimum_directional_support: 5.0
      relative_cost_tolerance:
      - 0.05
      - 0.01
      registration:
        voxel_size: 0.5
        neighbors: 5
        minimum_map_points: 100
        maximum_iterations: 4
        plane_residual_tolerance: 0.1
        prior_covariance_scale: 1000.0
        rotation_tolerance: 0.00017452006980802793
        position_tolerance: 0.00015
        gyro_variance: 0.1
        accel_variance: 1.0
        bias_variance: 0.0001
        initial_state_variance: 0.0001
        initial_bias_variance: 1.0e-05
      optimization:
        voxel_size: 1.0
        maximum_depth: 2
        minimum_points: 5
        minimum_planes: 10
        plane_variance:
        - 0.02
        - 0.0025
        plane_eigenvalue_ratio: 0.25
        plane_middle_ratio: 0.12
        imu_weight: 0.0001
        thread_count: 5
        maximum_iterations: 3
        gyro_variance: 0.01
        accel_variance: 1.0
        gyro_bias_psd: 0.0001
        accel_bias_psd: 0.0001
      uncertainty:
        allow_configured_fallback: true
        state_variance:
        - 1.0
        - 1.0
        - 1.0
        - 0.0001
        - 0.001
    filter:
      association_threads: 2
      maximum_iterations: 5
      convergence_tolerance: 0.001
      gyro_variance: 4.0e-06
      accel_variance: 0.5
      gyro_bias_psd: 1.33e-06
      accel_bias_psd: 2.15e-05
    map:
      voxel_size: 0.5
      maximum_roots: 1000000
      range_sigma: 0.02
      angle_sigma_degrees: 0.05
    sampling:
      initial_size: 0.25
      minimum_size: 0.02
      maximum_size: 1.0
      history_size: 5
      minimum_points: 1000.0
      maximum_points: 4000.0
      scale_threshold: 30.0
      exponent: 2.0
      proportional_scale: 0.1
      derivative_scale: 0.2
      proportional_minimum: 1.0e-06
      proportional_maximum: 0.0001
      derivative_minimum: 1.0e-09
      derivative_maximum: 1.0e-07
    window:
      maximum_interval: 0.12
      minimum_interval: 0.03
      normalized_error: 2.0
frontend_visualization:
  ros__parameters:
    path_max_poses: 5000
    map_voxel_size: 0.15
    map_max_voxels: 200000
    map_publish_period: 0.2
