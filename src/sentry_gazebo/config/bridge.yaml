%YAML 1.2
# ROS <-> Gazebo bridge for the sentry simulation.
#
# gz -> ros
#   /clock           sim time
#   /odom            ground truth, gz::sim::systems::OdometryPublisher
#   (/tf_odom -> /tf, odom -> base_link, is bridged by sim.launch.py only with
#    ground_truth_tf:=true; by default the localization stack owns base_link)
#   /lidar_*/points  the two gpu_lidar sensors (sensor topics set in the SDF)
#   /lidar_*/imu     the built-in IMU of each LiDAR (gz imu sensor, same origin)
#
# ros -> gz
#   /cmd_vel         consumed by gz::sim::systems::MecanumDrive
- ros_topic_name: "/clock"
  gz_topic_name: "/clock"
  ros_type_name: "rosgraph_msgs/msg/Clock"
  gz_type_name: "gz.msgs.Clock"
  direction: GZ_TO_ROS

- ros_topic_name: "/odom"
  gz_topic_name: "/odom"
  ros_type_name: "nav_msgs/msg/Odometry"
  gz_type_name: "gz.msgs.Odometry"
  direction: GZ_TO_ROS

- ros_topic_name: "/cmd_vel"
  gz_topic_name: "/cmd_vel"
  ros_type_name: "geometry_msgs/msg/Twist"
  gz_type_name: "gz.msgs.Twist"
  direction: ROS_TO_GZ

- ros_topic_name: "/lidar_mid360/points"
  gz_topic_name: "/lidar_mid360/points/points"
  ros_type_name: "sensor_msgs/msg/PointCloud2"
  gz_type_name: "gz.msgs.PointCloudPacked"
  # header.frame_id is the gz scoped name "sentry/mid360_link/mid360_lidar";
  # the launch file publishes an identity static transform from mid360_link.
  direction: GZ_TO_ROS

- ros_topic_name: "/lidar_l2/points"
  gz_topic_name: "/lidar_l2/points/points"
  ros_type_name: "sensor_msgs/msg/PointCloud2"
  gz_type_name: "gz.msgs.PointCloudPacked"
  # see the MID-360 entry above
  direction: GZ_TO_ROS

# specific force in m/s^2 (gravity included), frame is the gz scoped sensor
# name aliased onto the LiDAR link by the launch file
- ros_topic_name: "/lidar_mid360/imu"
  gz_topic_name: "/lidar_mid360/imu"
  ros_type_name: "sensor_msgs/msg/Imu"
  gz_type_name: "gz.msgs.IMU"
  direction: GZ_TO_ROS

- ros_topic_name: "/lidar_l2/imu"
  gz_topic_name: "/lidar_l2/imu"
  ros_type_name: "sensor_msgs/msg/Imu"
  gz_type_name: "gz.msgs.IMU"
  direction: GZ_TO_ROS
