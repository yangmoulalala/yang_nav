# MCU ordinary XY uses turret FLU axes; action yaw remains chassis-relative.
# gimbal_nav is observable without yaw_joint. base_link yaw is NOT observable.
controller_server:
  ros__parameters:
    # Match the 50 ms MPPI step so its control sequence advances each cycle.
    # Serial and smoothing remain 100 Hz. Commissioning command limits until
    # MCU axes/response are physically calibrated (max norm 0.354 m/s).
    controller_frequency: 20.0
    goal_checker:
      plugin: nav_behaviors::TranslationGoalChecker
      xy_goal_tolerance: 0.15
      trans_stopped_velocity: 0.03
    FollowPath:
      open_loop: false
      response_feedback: true
      vx_max: 0.25
      vx_min: -0.25
      vy_max: 0.25
      vx_std: 0.15   # was 0.05; wider noise lets MPPI reach the 0.25 m/s target speed
      vy_std: 0.15   # same
      # Reduce MPPI compute for real hardware: 20 steps × 0.05 s = 1 s horizon,
      # sufficient at 0.25 m/s. Halves rollout cost vs the sim default of 40 × 1000.
      time_steps: 20
      batch_size: 500
      zone:
        inner_plugin: nav_behaviors::TranslationMPPIController
        angular_control: false
        body_heading_available: false
        front_extent: 0.52
        rear_extent: 0.52
      critics: [ConstraintCritic, CostCritic, GoalCritic, TranslationVelocityCritic,
                PathAlignCritic, PathFollowCritic]
      TranslationVelocityCritic:
        enabled: true
        cost_weight: 200.0
        lookahead: 0.25
        gain: 1.0
        max_speed: 0.25
      GoalAngleCritic:
        enabled: false
      PathAngleCritic:
        enabled: false
      TwirlingCritic:
        enabled: false
      # Short real-car paths must be tracked from the first few cells. The
      # shared 20-cell offset and 1.4 m goal switch hid lateral response errors.
      PathAlignCritic:
        offset_from_furthest: 1
        trajectory_point_step: 1
        cost_weight: 40.0
        threshold_to_consider: 0.15
      PathFollowCritic:
        offset_from_furthest: 3
        cost_weight: 10.0
        threshold_to_consider: 0.25
      GoalCritic:
        threshold_to_consider: 0.30

