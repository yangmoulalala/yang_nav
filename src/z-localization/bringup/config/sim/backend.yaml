# 仿真用后端配置：继承默认配置，只覆盖与当前机器人和仿真相关的项。
extends: ../../backend/config/backend.yaml
common:
  # LIO 的里程计系叫 lio_odom；lio_odom -> base_link 由 lidar_fusion/base_tf 发布。
  odom_frame: lio_odom
  sensor_frame: imu
  body:
    # sensor(mid360_link) -> body(base_link)，由 URDF 正解得到（yaw_joint=0）。
    rotation:
      roll_deg: 105.0
      pitch_deg: 0.0
      yaw_deg: 0.0
    # sensor 原点指向 base_link 原点，在 body 系表达，单位米。
    offset:
      x: -0.05576
      y: 0.16359
      z: -0.13664
    frame: body
  scan_context:
    # MID-360 离地高度：ROBOT_Z 0.062 + 0.137。
    lidar_height: 0.2
# 地图保存与加载目录由 bringup/sim.launch.py 的 map_dir 给出（默认 <工作空间>/maps/sim）。
prior_map:
  enabled: false
uwb:
  enabled: false
