# 真车后端参数（bringup real.launch.py 使用）。sensor_frame 与前端 frames.imu 一致；
# sensor_frame <- base_link 外参由 URDF 经 TF 读取。
# 全部参数必填；键集合须与 backend/config/example.yaml 完全一致（tools/check_bringup_params.py 检查）。
# 地图模式与目录由 bringup launch 的 mode/prior_map/map_dir 给出，不在本文件。
backend_node:
  ros__parameters:
    common:
      # 使用 ZLIO 原子观测与高频预测协议。
      frontend: zlio
      # 全局地点描述子类型，可选 scan_context 或 gprobe。 [按车调整]
      descriptor_type: scan_context
      # 前端里程计坐标系。
      # LIO 里程计系；lio_odom -> base_link 由 ZLIO 前端发布（frames.base）。 [按车调整]
      odom_frame: lio_odom
      # 同步观测和预测使用的传感器坐标系。 [按车调整]
      sensor_frame: mid360_imu_link
      # ZLIO 去畸变点云位于 IMU 局部坐标系。
      input_cloud_in_local_frame: true
      # 车体输出坐标系名称；sensor_frame <- body_frame 外参由 URDF 经 TF 提供，按消息时间戳查询（跟踪云台关节）。 [按车调整]
      body_frame: base_link
      # 外参精确时刻不可用时，允许使用的最新 TF 与请求时刻的最大时间差，单位为秒；
      # 超出时节流告警并沿用上次有效外参。须 ≥0。
      body_extrinsic_tolerance: 0.2
      # 观测订阅队列深度；ZLIO 原子观测与 legacy 里程计/点云订阅共用，须 ≥1。
      observation_queue_depth: 50
      scan_context:
        # 是否启用 Scan Context 描述子。
        enabled: true
        # Scan Context 径向环数量。
        num_rings: 30
        # Scan Context 方位扇区数量。
        num_sectors: 90
        # 描述子覆盖的最大水平半径，单位为米。
        max_radius: 80.0
        # 描述子输入点云的体素边长，单位为米。
        downsample: 0.6
        # 描述子使用的雷达安装高度，单位为米。
        # MID-360 离地高度，m。 [按车调整]
        lidar_height: 0.2
        # 一个描述子栅格成为有效栅格所需的最少点数。
        min_bin_points: 1
        # 每个关键帧的描述子总数，包含原始描述子。
        augment_count: 3
        # 相邻横向增强之间的位移，单位为米。
        lateral_shift: 2.0
        # 粗航向附近的精搜索范围占整周的比例，范围为 0 到 1。
        search_ratio: 1.0
        # 回环检索时排除的最近关键帧数量。
        exclude_recent: 15
        # 描述子检索返回的最大候选数量。
        candidates: 15
        # 允许进入几何验证的最大描述子距离。
        distance_threshold: 0.8
        # 构造描述子前是否用前端 roll/pitch 整平点云。
        level_with_odom_roll_pitch: true
        # 列相似度平均方式：overlap 只按两帧都有点的扇区平均（上游行为）；union 按任一帧有点的扇区平均，
        # 单侧视野（侧装单雷达）用 union，否则所有候选距离退化为 0。不影响已保存的地图。 [按车调整]
        similarity_normalization: overlap
      # 全局地图坐标系名称。
      map_frame: map
      # 后端维护调度周期，单位为秒。
      maintenance_period: 0.2
    prior_map:
      # 加载先验地图后的可视化体素边长，单位为米。
      voxel_resolution: 0.15
    trajectory:
      keyframe:
        # 关键帧平移触发距离，单位为米；非正值关闭该触发器。 [按车调整]
        distance: -1.0
        # 关键帧旋转触发角度，单位为度；非正值关闭该触发器。 [按车调整]
        angle_deg: -1.0
        # 相邻关键帧允许的最小时间间隔，单位为秒。 [按车调整]
        min_interval: 0.0
        # 关键帧最大时间间隔，单位为秒；非正值关闭定时触发。 [按车调整]
        max_interval: 0.5
      # 无先验图时是否在正常退出时保存运行轨迹地图。
      save_on_shutdown: false
      # 保存地图包时是否额外输出合并后的全局 PCD。
      save_global_pcd: true
      # 合并运行地图时使用的体素边长，单位为米。
      map_voxel_resolution: 0.15
    registration:
      # 共享点到面配准的输入体素边长，单位为米。 [按车调整]
      voxel_resolution: 0.4
      # 每个配准层允许的最大求解迭代次数。
      max_iterations: 16
      # 收敛判据：在最终对应集上再解一步，平移步长上限，单位为米（上游固定 0.005）。
      convergence_translation: 0.005
      # 收敛判据：最终一步的旋转步长上限，单位为度（上游固定 0.1）。
      convergence_rotation_deg: 0.1
      # 点到目标平面锚点的最大对应距离，单位为米。
      max_correspondence_distance: 1.0
      # 平面邻域最远点允许的最大距离，单位为米；0 表示不限制。
      max_plane_neighbor_distance: 1.2
      # 候选几何验证要求的最小对应点比例。
      min_correspondence_ratio: 0.5
      # 细层支撑低于该比例时允许按需启动粗层。
      coarse_trigger_min_correspondence_ratio: 0.35
      # 恢复、回环和标定的最大点到面 RMSE，单位为米。
      max_rmse: 0.25
      # Huber 损失函数的残差转折尺度，单位为米。
      huber_delta: 0.25
      # 预计算目标平面时使用的近邻点数量。
      plane_knn: 8
      # 平面最小与最大特征值允许的最大比值。
      max_plane_eigenvalue_ratio: 0.2
      # 平面中间与最大特征值要求的最小比值，用于排除线结构。
      min_plane_middle_eigenvalue_ratio: 0.08
      # 构造合法点到面似然所需的最少对应点数。
      min_correspondences: 80
      # 由残差估计观测噪声时使用的标准差下限，单位为米。
      residual_std_floor: 0.03
      # 地图、平面和相关对应造成的局部位姿共模平移标准差下限，单位为米；0 表示关闭。
      measurement_translation_std_floor: 0.005
      # 局部位姿共模旋转标准差下限，单位为度；0 表示关闭。
      measurement_rotation_std_floor_deg: 0.02
      # 候选几何验证要求覆盖的最少水平扇区数。
      min_coverage_sectors: 6
      # Schur 条件数阈值；同时控制预条件器，不抬升图观测信息。
      degeneracy_condition_threshold: 10.0
    tracking:
      # 先验图目标子图最多包含的空间近邻关键帧数。
      target_keyframes: 11
      # 先验图目标子图的空间搜索半径，单位为米；0 表示不限。
      target_radius: 8.0
      # 选择先验参考关键帧的最大空间距离，单位为米；0 表示不限。
      nearest_reference_radius: 7.0
      source:
        # 一次观测最多累计的因果点云帧数。 [按车调整]
        max_frames: 5
        # 累计窗口允许的最大时间跨度，单位为秒；0 表示不限制。 [按车调整]
        max_time: 0.5
        # 累计窗口允许的最大相对旋转，单位为度；0 表示不限制。
        max_rotation_deg: 0.0
        # 一次观测成立所需的最少因果点云帧数。
        min_frames: 1
        # 累计窗口允许的最大相对平移，单位为米；0 表示不限制。
        max_translation: 1.5
      # NORMAL 状态全局观测周期，单位为秒。
      correction_period: 0.5
      # 切换先验参考关键帧前要求的距离优势，单位为米。
      target_hysteresis_distance: 0.5
      # 常规全局校正允许的最大平移变化，单位为米；0 表示不限。
      max_translation_correction: 1.5
      # 常规全局校正允许的最大旋转变化，单位为度；0 表示不限。
      max_rotation_correction_deg: 15.0
      # 直接进入 SUSPECT 的线速度阈值，单位为米每秒。
      suspicious_linear_speed: 10.0
      # 直接进入 SUSPECT 的角速度阈值，单位为弧度每秒。
      suspicious_angular_speed: 30.0
    recovery:
      # 开机初始化在里程计推算位置（地图原点或启动提示）附近检索的半径，单位为米；启动提示也用此半径。
      # 局中恢复（SUSPECT/LOST）只用 UWB，见 uwb.search_radius。
      initial_search_radius: 2.0
      source:
        # 一次观测成立所需的最少因果点云帧数。
        min_frames: 2
        # 一次观测最多累计的因果点云帧数。
        max_frames: 5
        # 累计窗口允许的最大时间跨度，单位为秒；0 表示不限制。
        max_time: 0.5
        # 累计窗口允许的最大相对平移，单位为米；0 表示不限制。
        max_translation: 1.5
        # 累计窗口允许的最大相对旋转，单位为度；0 表示不限制。
        max_rotation_deg: 0.0
      # 初始化阶段允许的最大描述子距离；0 表示不设门。
      initial_max_descriptor_distance: 0.8
      # SUSPECT/LOST 恢复允许的最大描述子距离；0 表示不设门。
      descriptor_distance_limit: 0.8
      # 无可信航向时一周内均匀生成的 yaw 假设数量。
      yaw_sweep_count: 6
      # 恢复阶段允许并行验证的候选数量；0 表示按硬件线程数。
      parallel_candidates: 16
      # 每次恢复最多进入几何验证的候选数量。
      max_candidates: 15
      # 恢复目标子图最多包含的先验关键帧数。
      target_keyframes: 11
      # 恢复目标子图的空间搜索半径，单位为米；0 表示不限。
      target_radius: 8.0
      # 恢复尝试的最小调度周期，单位为秒。
      period: 0.2
      # 局部召回失败后额外尝试的全局候选数量；0 不做全局重定位。
      global_fallback_candidates: 0
      # SUSPECT 升级到 LOST 所需的连续恢复失败次数。
      suspect_failures_before_lost: 3
      # LOST 状态是否持续自动尝试重定位（只在推算位置附近搜索）。
      automatic_when_lost: true
      # 提交恢复前要求连续给出一致位姿的次数；1 表示首次匹配即提交。
      confirmations: 2
      # 相邻恢复候选 map 到 odom 变换允许的平移差，单位为米。
      confirm_translation: 0.3
      # 相邻恢复候选 map 到 odom 变换允许的旋转差，单位为度。
      confirm_rotation_deg: 5.0
      # 恢复提交后的试用期（全局观测次数）；期间一次严重冲突即重新进入 SUSPECT；0 关闭。
      probation_observations: 5
      # 歧义检验：存在位姿明显不同且残差不超过最佳残差该倍数的解时推迟恢复；0 关闭；初始化不检验。
      ambiguity_rmse_ratio: 1.15
      # 歧义检验中判定两解不同的平移差，单位为米。
      ambiguity_translation: 1.0
      # 歧义检验中判定两解不同的旋转差，单位为度。
      ambiguity_rotation_deg: 30.0
    uwb:
      # 局中恢复（SUSPECT/LOST）是否使用裁判系统 UWB。UWB 只作重定位位置先验，不参与跟踪，也不用于判断定位是否正常；
      # 开机初始化不用 UWB。关闭或没有新鲜 UWB 时，SUSPECT/LOST 不做重定位，只等待。 [按车调整]
      enabled: false
      # UWB 消息的 frame_id，不一致的消息被丢弃。己方颜色从 uwb_pose/team（red/blue）读取。
      frame: uwb
      # UWB 消息时刻到物理运动时刻的固定偏置，t_motion=t_header+dt，单位为秒。 [按车调整]
      time_offset_seconds: -0.15
      antenna_position_body:
        # UWB 天线在 body 系中的 X 位置，单位为米。 [按车调整]
        x: -0.245
        # UWB 天线在 body 系中的 Y 位置，单位为米。 [按车调整]
        y: 0.0
        # UWB 天线在 body 系中的 Z 位置，单位为米。 [按车调整]
        z: 0.0
      # 己方为红方时 UWB 坐标系到 map 的固定变换（与地图包绑定，换地图要重设）。 [按车调整]
      zero_pose_red:
        # T_map_uwb 的 X 平移，单位为米。
        x: 0.0
        # T_map_uwb 的 Y 平移，单位为米。
        y: 0.0
        # T_map_uwb 的航向，单位为度。
        yaw_deg: 0.0
      # 己方为蓝方时 UWB 坐标系到 map 的固定变换。 [按车调整]
      zero_pose_blue:
        # T_map_uwb 的 X 平移，单位为米。
        x: 0.0
        # T_map_uwb 的 Y 平移，单位为米。
        y: 0.0
        # T_map_uwb 的航向，单位为度。
        yaw_deg: 0.0
      # UWB 读数（按运动时刻）相对当前帧允许的最大年龄，单位为秒；超出视为没有 UWB。
      max_age: 1.2
      # UWB 运动时刻与里程计插值端点的最大时间间隔，单位为秒。
      odom_sync_tolerance: 0.25
      # 以 UWB 位置召回先验关键帧的半径，单位为米。
      search_radius: 2.0
      # UWB 位置召回最多保留的先验关键帧数量。
      candidates: 8
      # 恢复解推算的天线位置与 UWB 读数允许的最大水平偏差，单位为米；0 关闭。
      max_offset: 0.6
    loop:
      # 是否在无先验图时启用运行轨迹回环。
      enabled: true
      # 回环目标子图最多包含的历史关键帧数。
      target_keyframes: 17
      # 回环目标子图的空间搜索半径，单位为米；0 表示不限。
      target_radius: 12.0
      # 成功回环后再次检索所需的最少关键帧间隔。
      cooldown_keyframes: 5
      # 回环候选允许的最大优化位姿距离，单位为米；0 表示不限。
      candidate_max_distance: 7.0
      # 回环最佳与次佳描述子距离的比值上限。
      descriptor_ratio_threshold: 1.0
      source:
        # 一次观测成立所需的最少因果点云帧数。
        min_frames: 1
        # 一次观测最多累计的因果点云帧数。
        max_frames: 4
        # 累计窗口允许的最大时间跨度，单位为秒；0 表示不限制。
        max_time: 0.0
        # 累计窗口允许的最大相对平移，单位为米；0 表示不限制。
        max_translation: 0.0
        # 累计窗口允许的最大相对旋转，单位为度；0 表示不限制。
        max_rotation_deg: 0.0
      # 单周期允许并行执行的回环候选验证数量。
      max_parallel_verifications: 4
      # PCM 和可视化保留的已接受回环数量；0 表示不限。
      history_size: 200
      validation:
        # 回环测量允许的最大平移长度，单位为米。
        max_translation: 3.0
        # 回环测量允许的最大垂直位移，单位为米。
        max_z: 0.5
        # 回环测量允许的最大 roll/pitch，单位为度。
        max_roll_pitch_deg: 10.0
        # 回环几何 yaw 与描述子 seed 允许的最大差值，单位为度。
        max_yaw_residual_deg: 60.0
        # 计算独立几何重叠率时的点邻近距离，单位为米。
        overlap_distance: 0.5
        # 接受回环要求的最小独立几何重叠率。
        min_overlap_ratio: 0.45
      pcm:
        # 是否启用回环成对一致性最大团验证。
        enabled: true
        # PCM 闭合误差允许的最大平移，单位为米。
        translation_threshold: 1.0
        # PCM 闭合误差允许的最大旋转，单位为度。
        rotation_threshold_deg: 15.0
        # 提交回环要求的最少历史一致边数量，达到即停止历史检查；无适用历史时允许启动。
        min_consistent_loops: 1
        # 同源候选批次要求的最小一致团规模。
        min_candidate_clique_size: 1
    graph:
      odom_noise:
        # 里程计边每秒累计的旋转过程方差。
        rotation_variance_per_second: 1.0e-06
        # 里程计边每秒累计的平移过程方差。
        translation_variance_per_second: 0.0005
        # 里程计边每弧度运动附加的旋转过程方差。
        rotation_variance_per_radian: 3.0e-07
        # 里程计边每米运动附加的平移过程方差。
        translation_variance_per_meter: 0.0002
      # 不需历史回环时保留位姿变量的固定滞后时长，单位为秒；0 使用完整图。
      fixed_lag_seconds: 30.0
      # 图规范先验的各轴旋转方差，单位为弧度平方。
      prior_rotation_variance: 0.0001
      # 图规范先验的各轴平移方差，单位为米平方。
      prior_translation_variance: 0.01
      robust:
        # 是否为机会型回环因子启用图内鲁棒核。
        enabled: true
        # 机会型回环使用的鲁棒核名称。
        kernel: cauchy
        # 鲁棒核按白化残差分量 RMS 定义的阈值。
        size: 0.5
    reset:
      # reset 响应超时重试间隔，单位为秒；重试沿用同一事务 ID。
      response_timeout: 5.0
      # 两次新 reset 事务之间的最小时间间隔，单位为秒。
      min_gap: 10.0
      # 无有效坐标边界的停车 reset 在途平移标准差，单位为米。
      stationary_translation_std: 0.05
      # 无有效坐标边界的停车 reset 在途旋转标准差，单位为度。
      stationary_rotation_std_deg: 1.0
    startup_hint:
      # 是否提供 epoch 0 时 body 在 map 中的近似启动位姿。 [按车调整]
      enabled: false
      # 有先验图时是否持续只用启动提示做几何验证直至成功。
      force_until_matched: true
      # 启动提示中 body 在 map 下的 X 坐标，单位为米。 [按车调整]
      x: 4.6
      # 启动提示中 body 在 map 下的 Y 坐标，单位为米。 [按车调整]
      y: 7.5
      # 启动提示中 body 在 map 下的 Z 坐标，单位为米。 [按车调整]
      z: 0.15
      # 启动提示中 body 在 map 下的偏航角，单位为度。 [按车调整]
      yaw_deg: 0.0
    innovation:
      # 联合 NIS 卡方上尾概率低于该值时判定观测冲突。
      rejection_probability: 0.001
      # 从 OBS_DEGRADED 升级到 SUSPECT 所需的连续冲突次数。
      conflicts_before_suspect: 7
      # 严重冲突的卡方上尾概率上限；先验图观测低于该值或触发物理校正上限、且配准支撑充分时计为严重冲突。
      severe_rejection_probability: 1.0e-8
      # 严重冲突要求的最小配准对应比例。
      severe_min_support_ratio: 0.6
      # 连续冲突中累计多少次严重冲突即进入 SUSPECT（不必等 conflicts_before_suspect）。
      severe_conflicts_before_suspect: 2
    pure_odometry:
      # 纯 odom 时 odom 原点在 map 中的 X 坐标，单位为米。
      origin_x: 0.0
      # 纯 odom 时 odom 原点在 map 中的 Y 坐标，单位为米。
      origin_y: 0.0
    visualization:
      # 是否启用后端 RViz 可视化输出。bringup 默认打开，rviz:=true 只负责启动 RViz 窗口。
      # 先验定位时 runtime_map 自动关闭、显示 prior_map；建图时相反。 [按车调整]
      enabled: true
      # 是否发布不可变先验地图。
      publish_prior_map: true
      # 是否发布运行轨迹累计地图。
      publish_runtime_map: true
      # 是否发布地图关键帧坐标轴标记。
      publish_map_axes: true
      # 是否发布前端轨迹与优化轨迹。
      publish_paths: true
      # 是否发布最近一次配准的 source/target 调试点云。
      publish_debug_registration: false
      # 地图类可视化的最小发布周期，单位为秒。
      map_publish_period: 2.0
    output:
      world_cloud:
        # 是否发布变换到 map 坐标系的实时点云。
        enabled: true
        # 实时 map 系点云最小发布周期，单位为秒；0 表示每帧。
        publish_period: 0.0
        # INITIALIZING 时是否发布实时 map 系点云。
        publish_initializing: false
        # SUSPECT/LOST 时是否发布实时点云（SUSPECT 用里程计前推位姿，LOST 用冻结位姿）。
        publish_untrusted: false
    storage:
      # 原始点云缓存保留预算，单位为 MiB；0 表示不保留缓存。
      cloud_cache_mb: 64
      # 子图和派生几何的缓存预算，单位为 MiB；0 表示不保留缓存。
      submap_cache_mb: 64
