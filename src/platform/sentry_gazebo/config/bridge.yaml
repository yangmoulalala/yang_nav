%YAML 1.2
---
# ROS <-> Gazebo bridge for the sentry simulation.
#
# gz -> ros
#   /clock           sim time
#   (no ground-truth /odom: the real robot has none; the localization stack
#    owns map -> lio_odom -> gimbal_nav)
#   /lidar_*/points  the two gpu_lidar sensors (sensor topics set in the SDF)
#   /lidar_*/imu     the built-in IMU of each LiDAR (MID-360 uses the URDF factory IMU mount)
#
# ros -> gz
#   /sim/chassis_cmd_vel   MCU simulator output -> MecanumDrive
- ros_topic_name: "/clock"
  gz_topic_name: "/clock"
  ros_type_name: "rosgraph_msgs/msg/Clock"
  gz_type_name: "gz.msgs.Clock"
  direction: GZ_TO_ROS

- ros_topic_name: "/sim/chassis_cmd_vel"
  gz_topic_name: "/sim/chassis_cmd_vel"
  ros_type_name: "geometry_msgs/msg/Twist"
  gz_type_name: "gz.msgs.Twist"
  direction: ROS_TO_GZ

# Private physical state is consumed only by chassis_sim, never localization TF.
- ros_topic_name: "/sim/joint_states"
  gz_topic_name: "/sim/joint_states"
  ros_type_name: "sensor_msgs/msg/JointState"
  gz_type_name: "gz.msgs.Model"
  direction: GZ_TO_ROS

- ros_topic_name: "/sim/yaw_joint_target"
  gz_topic_name: "/sim/yaw_joint_target"
  ros_type_name: "std_msgs/msg/Float64"
  gz_type_name: "gz.msgs.Double"
  direction: ROS_TO_GZ

- ros_topic_name: "/lidar_mid360/points"
  gz_topic_name: "/lidar_mid360/points/points"
  ros_type_name: "sensor_msgs/msg/PointCloud2"
  gz_type_name: "gz.msgs.PointCloudPacked"
  # header.frame_id is the gz scoped name "sentry/mid360_link/mid360_lidar";
  # the launch file publishes an identity static transform from mid360_link.
  direction: GZ_TO_ROS

- ros_topic_name: "/lidar_l2/points"
  gz_topic_name: "/lidar_l2/points/points"
  ros_type_name: "sensor_msgs/msg/PointCloud2"
  gz_type_name: "gz.msgs.PointCloudPacked"
  # see the MID-360 entry above
  direction: GZ_TO_ROS

# specific force in m/s^2 (gravity included), frame is the gz scoped sensor
# name aliased onto the LiDAR link by the launch file
- ros_topic_name: "/lidar_mid360/imu"
  gz_topic_name: "/lidar_mid360/imu"
  ros_type_name: "sensor_msgs/msg/Imu"
  gz_type_name: "gz.msgs.IMU"
  direction: GZ_TO_ROS

- ros_topic_name: "/lidar_l2/imu"
  gz_topic_name: "/lidar_l2/imu"
  ros_type_name: "sensor_msgs/msg/Imu"
  gz_type_name: "gz.msgs.IMU"
  direction: GZ_TO_ROS
