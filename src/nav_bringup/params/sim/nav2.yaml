# Nav2 (Jazzy) parameters, sentry v2, RMUC sim, omni chassis.  Milestone M0.
#
# cmd_vel chain (M0):
#   controller_server / behavior_server -> cmd_vel_nav -> velocity_smoother -> cmd_vel_smoothed
#   -> cmd_gate (localization gate, watchdog, per-mode limits) -> /cmd_vel
# collision_monitor joins in M2 once terrain_node publishes ground-free obstacles.
# Frames: map (backend) -> lio_odom (ZLIO) -> base_link.  Odometry: /localization/odometry
# (map <- base_link, body-frame twist).
# Costmaps in M0: static traversability layer (/nav_map) + inflation only.

bt_navigator:
  ros__parameters:
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /localization/odometry
    bt_loop_duration: 10
    default_server_timeout: 200   # ms; 20 ms timed out follow_path while the controller was busy
    wait_for_service_timeout: 1000
    action_server_result_timeout: 900.0
    navigators: [navigate_to_pose, navigate_through_poses]
    navigate_to_pose:
      plugin: nav2_bt_navigator::NavigateToPoseNavigator
    navigate_through_poses:
      plugin: nav2_bt_navigator::NavigateThroughPosesNavigator
    error_code_names: [compute_path_error_code, follow_path_error_code]

controller_server:
  ros__parameters:
    controller_frequency: 20.0   # = 1 / model_dt
    costmap_update_timeout: 0.30
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.5
    odom_topic: /localization/odometry
    progress_checker_plugins: [progress_checker]
    goal_checker_plugins: [goal_checker]
    controller_plugins: [FollowPath]
    progress_checker:
      plugin: nav2_controller::SimpleProgressChecker
      required_movement_radius: 0.3
      movement_time_allowance: 10.0
    goal_checker:
      plugin: nav2_controller::SimpleGoalChecker
      xy_goal_tolerance: 0.15   # 0.10 left the footprint-checked robot hovering 0.1-0.2 m off goals near walls
      yaw_goal_tolerance: 0.30
      stateful: true
    FollowPath:
      plugin: nav2_mppi_controller::MPPIController
      motion_model: Omni
      # old branch: 2000 x 56 ran at 5 Hz on this machine, 1000 x 40 keeps 20 Hz
      time_steps: 40
      model_dt: 0.05
      batch_size: 1000
      iteration_count: 1
      retry_attempt_limit: 3   # re-sample when every rollout collides (tight spots by walls)
      vx_std: 0.25
      vy_std: 0.25
      wz_std: 0.4
      vx_max: 1.5
      vx_min: -1.5
      vy_max: 1.5
      wz_max: 2.0
      ax_max: 3.0
      ax_min: -3.0
      ay_max: 3.0
      ay_min: -3.0
      az_max: 4.0
      temperature: 0.3
      gamma: 0.015
      # map -> lio_odom arrives at LiDAR rate (10 Hz); 0.1 s aborts with extrapolation errors
      transform_tolerance: 0.5
      visualize: false
      regenerate_noises: true
      reset_period: 1.0
      critics: [ConstraintCritic, CostCritic, GoalCritic, GoalAngleCritic, PathAlignCritic,
                PathFollowCritic, PathAngleCritic, TwirlingCritic]
      ConstraintCritic:
        enabled: true
        cost_power: 1
        cost_weight: 4.0
      GoalCritic:
        enabled: true
        cost_power: 1
        cost_weight: 8.0   # hold position while the final rotation finishes
        threshold_to_consider: 1.4
      GoalAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 3.0
        threshold_to_consider: 1.5   # rotate during the approach; a 150 deg turn at the goal made MPPI wander off it
      CostCritic:
        enabled: true
        cost_power: 1
        cost_weight: 3.81
        near_collision_cost: 253
        critical_cost: 300.0
        # footprint check: the 0.68 x 0.60 box (turret to x 0.38) is not a circle; checking only the
        # centre let the corners reach walls. (The old 5 Hz loop was the map->lio_odom TF wait, not this.)
        consider_footprint: true
        collision_cost: 1000000.0
        near_goal_distance: 1.0
        trajectory_point_step: 2
      PathAlignCritic:
        enabled: true
        cost_power: 1
        cost_weight: 14.0
        max_path_occupancy_ratio: 0.05
        trajectory_point_step: 4
        threshold_to_consider: 0.5
        offset_from_furthest: 20
        use_path_orientations: false
      PathFollowCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        offset_from_furthest: 5
        threshold_to_consider: 1.4
      PathAngleCritic:
        # mode 2: long axis on the path, either direction (omni, no preferred front)
        enabled: false   # omni: no heading needed in normal mode; rotating near edges swept the footprint corner into lethal cells
        cost_power: 1
        cost_weight: 2.0
        offset_from_furthest: 4
        threshold_to_consider: 0.5
        max_angle_to_furthest: 0.5
        mode: 2
      TwirlingCritic:
        enabled: true
        twirling_cost_power: 1
        twirling_cost_weight: 6.0

local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 20.0
      publish_frequency: 20.0
      global_frame: map   # not lio_odom: MPPI would wait in canTransform for map->lio_odom (8.3 Hz) and run at ~5 Hz
      robot_base_frame: base_link
      transform_tolerance: 0.5
      rolling_window: true
      width: 8    # > 2 x MPPI reach (1.5 m/s x 2 s); off-grid rollout poses count as collisions
      height: 8
      resolution: 0.025
      # chassis 0.594 m square + turret reaching x 0.374 (URDF meshes, turret at zero)
      footprint: "[[0.38, 0.30], [0.38, -0.30], [-0.30, -0.30], [-0.30, 0.30]]"
      footprint_padding: 0.01
      plugins: [static_layer, inflation_layer]
      static_layer:
        plugin: nav2_costmap_2d::StaticLayer
        map_topic: /nav_map
        map_subscribe_transient_local: true
        trinary_costmap: false
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        inflation_radius: 0.65   # > circumscribed radius 0.49 + padding
        cost_scaling_factor: 4.0
      always_send_full_costmap: true

global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 2.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_link
      transform_tolerance: 0.5
      resolution: 0.025
      track_unknown_space: false
      footprint: "[[0.38, 0.30], [0.38, -0.30], [-0.30, -0.30], [-0.30, 0.30]]"
      footprint_padding: 0.01
      plugins: [static_layer, inflation_layer]
      static_layer:
        plugin: nav2_costmap_2d::StaticLayer
        map_topic: /nav_map
        map_subscribe_transient_local: true
        trinary_costmap: false
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        inflation_radius: 0.90   # slow decay keeps Smac (point robot) paths mid-corridor
        cost_scaling_factor: 1.5
      always_send_full_costmap: true

nav_map_server:
  ros__parameters:
    topic_name: /nav_map
    frame_id: map
    yaml_filename: ""   # set by the launch file

planner_server:
  ros__parameters:
    expected_planner_frequency: 5.0
    planner_plugins: [GridBased]
    GridBased:
      # omni chassis: 2-D search; cost-aware so grey (slope) cells are avoided when cheap
      plugin: nav2_smac_planner::SmacPlanner2D
      tolerance: 0.15
      downsample_costmap: false
      allow_unknown: false
      max_iterations: 1000000
      max_on_approach_iterations: 1000
      max_planning_time: 2.0
      cost_travel_multiplier: 3.0
      use_final_approach_orientation: false
      smoother:
        max_iterations: 1000
        w_smooth: 0.3
        w_data: 0.2
        tolerance: 1.0e-10

smoother_server:
  ros__parameters:
    smoother_plugins: [simple_smoother, zone_shaper]
    simple_smoother:
      plugin: nav2_smoother::SimpleSmoother
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: true
    zone_shaper:
      # M3b: tunnel stretches -> lead-in / zone axis / lead-out with headings (nav_behaviors)
      plugin: nav_behaviors::ZonePathShaper
      zones_file: ""        # set by navigation.launch.py: <terrain_dir>/zones.yaml
      min_cells: 50          # smaller tunnel zones are label fragments
      axis_margin: 0.5       # straight axis beyond each mouth, m
      lead_length: 1.5       # planner path replaced by each lead curve, m (turn spread over it)
      lead_growth: 1.5
      max_retries: 2
      spacing: 0.025
      max_body_offset: 0.03  # lateral shift allowed inside the tunnel (opening 0.8 m, robot 0.62 m padded)
      max_side_offset: 0.06  # lateral shift at the outer end of each 0.5 m margin (one-sided wall bumps)
      offset_step: 0.01
      tangent_window: 0.25   # Smac tangent averaged over +- this arc length
      footprint: "[[0.38, 0.30], [0.38, -0.30], [-0.30, -0.30], [-0.30, 0.30]]"
      footprint_padding: 0.01
      collision_tolerance: 0.04   # shaper ignores wall contact up to 4 cm; MPPI handles the rest

behavior_server:
  ros__parameters:
    local_costmap_topic: local_costmap/costmap_raw
    global_costmap_topic: global_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    global_footprint_topic: global_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: [spin, backup, drive_on_heading, wait]
    spin:
      plugin: nav2_behaviors::Spin
    backup:
      plugin: nav2_behaviors::BackUp
    drive_on_heading:
      plugin: nav2_behaviors::DriveOnHeading
    wait:
      plugin: nav2_behaviors::Wait
    local_frame: map   # must match local_costmap global_frame, else backup fails with "Pose Goes Off Grid"
    global_frame: map
    robot_base_frame: base_link
    transform_tolerance: 0.5
    simulate_ahead_time: 1.0
    max_rotational_vel: 1.5
    min_rotational_vel: 0.4
    rotational_acc_lim: 3.2

velocity_smoother:
  ros__parameters:
    smoothing_frequency: 30.0
    scale_velocities: false
    feedback: OPEN_LOOP
    max_velocity: [1.6, 1.6, 2.5]
    min_velocity: [-1.6, -1.6, -2.5]
    max_accel: [3.0, 3.0, 4.0]
    max_decel: [-3.0, -3.0, -4.0]
    odom_topic: /localization/odometry
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 0.5

cmd_gate:
  ros__parameters:
    rate: 30.0
    input_timeout: 0.25
    state_timeout: 1.0
    idle_stop_time: 0.5
    state_topic: /backend_node/localization_state
    mode_topic: /nav_mode
    limits:
      normal:   {max_linear: 1.6, max_angular: 2.5}
      tunnel:   {max_linear: 0.6, max_angular: 1.0}
      ramp:     {max_linear: 2.0, max_angular: 2.5}
      recovery: {max_linear: 0.6, max_angular: 1.5}
